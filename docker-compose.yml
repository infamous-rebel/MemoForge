version: "3.9"
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: memoforge
      POSTGRES_USER: memoforge
      POSTGRES_PASSWORD: memoforge
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://memoforge:memoforge@postgres:5432/memoforge
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - postgres
      - redis
    ports:
      - "8000:8000"
    volumes:
      - ./output:/app/output

volumes:
  pgdata:
